<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <img src="logo.png" alt="Логотип" class="header__logo">
      <input type="text" class="header__search" placeholder="Поиск товаров...">
    </div>
  </header>

  <main class="main">
    <div class="container">

      <div class="filter">
        <button class="filter__btn filter__btn--active" data-category="all">Все</button>
        <button class="filter__btn" data-category="first">1 категория</button>
        <button class="filter__btn" data-category="second">2 категория</button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>&copy; 2026 Каталог товаров / Ангелина Краснова</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
